# Local development only. Production is deployed by Coolify/Railpack.

services:
  payload:
    image: node:20-alpine
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - .:/home/node/app
      - node_modules:/home/node/app/node_modules
    working_dir: /home/node/app/
    command: sh -c "npm install && npm run dev"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.development.local
    environment:
      DATABASE_URL: postgresql://localhostusak_user:localhostusak_dev_password@postgres:5432/localhostusak

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: localhostusak_user
      POSTGRES_PASSWORD: localhostusak_dev_password
      POSTGRES_DB: localhostusak
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U localhostusak_user -d localhostusak']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
  node_modules:
