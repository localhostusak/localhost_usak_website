  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Early Theme Detection: Always dark (modern) unless user manually switched this session -->
  <script>
    (function() {
      try {
        localStorage.removeItem('localhostusak_theme');
        localStorage.removeItem('localhostusak_theme_manual');
        var manual = sessionStorage.getItem('localhostusak_theme_manual');
        var saved = sessionStorage.getItem('localhostusak_theme');
        var theme = (manual === 'true' && (saved === 'modern' || saved === 'pixel')) ? saved : 'modern';
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>
